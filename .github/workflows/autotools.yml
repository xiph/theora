name: Autotools build

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 1 * *'

permissions: read-all

jobs:
  build:
    strategy:
      matrix:
        os:
          [
            ubuntu-latest,
            macos-latest,
          ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install macOS dependencies
        if: startsWith(matrix.os,'macos')
        run: brew install automake pkg-config libtool libogg

      - name: Install Linux dependencies
        if: startsWith(matrix.os,'ubuntu')
        run: sudo apt install automake pkgconf libtool libogg-dev libvorbis-dev libsdl1.2-dev libpng-dev libtiff-dev doxygen fig2dev texlive texlive-latex-extra

      - name: configure
        run: |
          ./autogen.sh
          ./configure

      - name: build
        run: make

      - name: test
        run: make check

      - name: distcheck
        if: startsWith(matrix.os,'ubuntu')
        run: make distcheck
